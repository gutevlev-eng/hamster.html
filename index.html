<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131c">
<title>Hamster Empire — Business Edition</title>
<style>
:root{
  color-scheme:dark;
  --bg:#10131c;
  --surface:#191e2b;
  --panel:rgba(29,36,52,.86);
  --input:#131a28;
  --text:#f5f7ff;
  --muted:#95a3bb;
  --border:rgba(190,211,255,.1);
  --gold:#f4c45a;
  --blue:#58c9ff;
  --green:#65dfac;
  --nav:rgba(16,21,32,.95);
  --shadow:0 18px 48px #0003;
  --glow:rgba(58,103,214,.2);
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#edf1f8;
  --surface:#fff;
  --panel:rgba(255,255,255,.9);
  --input:#eef2f9;
  --text:#182338;
  --muted:#687891;
  --border:rgba(39,64,106,.12);
  --gold:#c58c18;
  --blue:#087fc0;
  --green:#138859;
  --nav:rgba(255,255,255,.96);
  --shadow:0 15px 45px #243b6010;
  --glow:rgba(83,133,233,.13);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  transition:background .25s,color .25s;
}
button,input,select{font:inherit}
button{
  color:inherit;border:0;cursor:pointer;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
button:disabled{opacity:.42;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{
  outline:3px solid var(--blue);outline-offset:3px
}
a{color:var(--blue)}
.app{
  width:min(100%,540px);min-height:100dvh;margin:auto;
  position:relative;isolation:isolate;overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 22%,var(--glow),transparent 52%),
    var(--bg);
}
.ambient{
  position:absolute;inset:0;pointer-events:none;z-index:-1;overflow:hidden
}
.ambient::before,.ambient::after{
  content:"";position:absolute;width:350px;height:350px;
  border-radius:50%;filter:blur(65px);opacity:.14;
  background:#3479ff;left:-190px;top:180px;
  animation:ambientMove 15s ease-in-out infinite alternate;
}
.ambient::after{
  left:auto;right:-210px;top:460px;background:#e7a231;
  animation-delay:-7s;
}
@keyframes ambientMove{
  to{transform:translate(70px,110px) scale(1.15)}
}
.header{padding:calc(17px + env(safe-area-inset-top)) 18px 10px}
.profile{display:flex;align-items:center;gap:10px}
.avatar{
  flex:none;width:46px;height:46px;border-radius:16px;
  display:grid;place-items:center;font-size:27px;overflow:hidden;
  background:linear-gradient(145deg,#f7d581,#9f6925);
  box-shadow:inset 0 0 0 1px #ffffff45,0 5px 17px #0002;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile-info{min-width:0;flex:1}
.profile-name{
  font-weight:850;font-size:14px;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis
}
.sub{font-size:10px;color:var(--muted);margin-top:4px}
.icon-button{
  flex:none;width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;background:var(--panel);
  border:1px solid var(--border);font-size:20px
}
.exchange-button{
  display:flex;align-items:center;gap:6px;padding:9px 8px;
  border:1px solid var(--border);border-radius:12px;
  background:var(--panel);font-size:10px
}
.exchange-logo{
  width:21px;height:21px;border-radius:7px;
  display:grid;place-items:center;font-weight:900;
  background:#f4c45a;color:#37270c;flex:none
}
.rank-row{
  display:flex;justify-content:space-between;align-items:center;
  font-size:11px;margin:16px 0 8px;gap:10px
}
.rank-row strong{font-size:12px}
.progress{
  height:7px;border-radius:20px;background:var(--border);overflow:hidden
}
.progress i{
  display:block;height:100%;width:0;border-radius:inherit;
  background:linear-gradient(90deg,#497aff,#58c9ff,#f4c45a);
  transition:width .35s linear
}
main{padding:9px 16px calc(99px + env(safe-area-inset-bottom))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{
  background:var(--panel);border:1px solid var(--border);
  padding:12px 5px;border-radius:16px;text-align:center;min-width:0
}
.stat-label{font-size:10px;color:var(--muted);min-height:27px;line-height:1.4}
.stat-value{font-size:15px;font-weight:850;margin-top:4px}
.gold{color:var(--gold)}
.green{color:var(--green)}
.blue{color:var(--blue)}
.balance{
  display:flex;align-items:center;justify-content:center;gap:11px;
  margin:23px 0 6px;font-size:clamp(26px,8vw,42px);
  font-weight:900;letter-spacing:-1.2px;font-variant-numeric:tabular-nums
}
.coin{
  flex:none;width:39px;height:39px;border-radius:50%;
  display:grid;place-items:center;font-size:23px;
  color:#936214;background:linear-gradient(140deg,#fff1b6,#fbc94e 55%,#d99720);
  border:3px solid #ffe38d;
  box-shadow:inset 0 0 0 2px #dba434,0 5px 20px #f3ba2f25;
}
.balance-caption{text-align:center;font-size:11px;color:var(--muted)}
.hero-wrap{
  width:min(100%,350px);margin:17px auto 11px;
  position:relative;aspect-ratio:1;
}
.hero-wrap::before{
  content:"";position:absolute;inset:3px;border-radius:50%;
  border:1px dashed #789cff45;
  animation:orbit 55s linear infinite;pointer-events:none;
}
.hero-wrap::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  box-shadow:0 0 45px #3977ff18;
  animation:breathe 4s ease-in-out infinite;pointer-events:none
}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes breathe{50%{opacity:.4;transform:scale(1.035)}}
.hero{
  position:absolute;inset:13px;width:calc(100% - 26px);
  border-radius:50%;padding:0;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;
  background:
    radial-gradient(ellipse at 50% 87%,#01061280,transparent 44%),
    radial-gradient(circle at 50% 32%,#405982,#223b65 45%,#111e37 85%);
  border:4px solid #5875a955;
  box-shadow:
    inset 0 0 38px #94bfff14,
    0 13px 40px #0002,0 0 0 6px #5579bd0c;
  transition:transform .13s ease-out,border-color .3s;
  will-change:transform;
}
.hero.cipher{
  background:radial-gradient(circle at 50% 35%,#683c58,#281a32);
  border-color:#ca668a70
}
.hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(135deg,#ffffff0b,transparent 48%)
}
.hero-photo{
  position:absolute;left:2%;bottom:1%;width:96%;height:96%;
  object-fit:contain;pointer-events:none;
  filter:drop-shadow(0 12px 8px #0005);
  animation:hamsterBreath 4.8s ease-in-out infinite;
  transform-origin:50% 95%;
}
@keyframes hamsterBreath{
  50%{transform:translateY(-3px) scale(1.008)}
}
.hero-placeholder{
  height:100%;display:flex;flex-direction:column;justify-content:center;
  align-items:center;gap:10px;padding:25px;
  color:#e8f0ff;pointer-events:none
}
.hero-placeholder b{font-size:35px;letter-spacing:-1px}
.hero-placeholder span{font-size:12px;line-height:1.7;max-width:220px}
.photo-button{
  display:block;margin:0 auto 18px;font-size:11px;
  padding:8px 13px;border-radius:20px;background:var(--panel);
  border:1px solid var(--border);color:var(--muted)
}
.status-row{display:flex;align-items:center;gap:13px}
.energy{flex:1;min-width:0}
.energy-label{
  display:flex;align-items:center;justify-content:space-between;
  gap:7px;margin-bottom:8px;font-weight:750;font-size:12px
}
.energy .progress i{background:linear-gradient(90deg,#df9a2d,#ffe19b)}
.boost{
  padding:13px 16px;border-radius:14px;background:var(--panel);
  border:1px solid var(--border);font-size:12px;font-weight:850
}
.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:17px 0 12px}
.panel{
  background:var(--panel);border:1px solid var(--border);
  border-radius:19px;padding:16px;margin-bottom:12px;
  box-shadow:var(--shadow)
}
.no-shadow{box-shadow:none}
.section-title{font-size:25px;letter-spacing:-.8px;margin:9px 0;font-weight:900}
.description{font-size:12px;line-height:1.75;color:var(--muted);margin:0 0 15px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.small{font-size:11px;line-height:1.65;color:var(--muted)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  gap:7px;min-height:43px;padding:12px 15px;border-radius:13px;
  background:linear-gradient(135deg,#f9d584,#eeb84d);
  color:#352509;font-size:12px;font-weight:850;
  text-decoration:none;transition:transform .15s,filter .15s;
}
.btn:not(:disabled):active{transform:scale(.97)}
.btn.secondary{
  background:var(--input);color:var(--text);border:1px solid var(--border)
}
.btn.success{background:#66dbad;color:#0c3626}
.btn.danger{background:#e45b6c;color:#fff}
.btn.wide{width:100%;margin-top:12px}
.tabs{
  display:flex;gap:7px;padding:3px 0 13px;overflow-x:auto;
  scrollbar-width:none
}
.tab{
  flex:none;white-space:nowrap;border-radius:11px;padding:10px 13px;
  background:var(--panel);border:1px solid var(--border);font-size:11px
}
.tab.active{background:#f4c45a;color:#352509;font-weight:850;border-color:transparent}
.search-row{display:flex;gap:8px;margin-bottom:13px}
.field{
  width:100%;min-width:0;border:1px solid var(--border);
  background:var(--input);color:var(--text);border-radius:12px;padding:12px
}
.search-row select{max-width:150px;font-size:11px}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.mine-card{
  display:flex;flex-direction:column;text-align:left;overflow:hidden;
  border-radius:17px;border:1px solid var(--border);
  background:var(--panel);padding:0;min-height:212px;
  transition:transform .16s,border-color .16s;
}
.mine-card:hover{border-color:#81aaff40}
.mine-card:active{transform:scale(.98)}
.card-art{
  position:relative;height:67px;display:grid;place-items:center;
  background:radial-gradient(ellipse at 50% 100%,var(--card-glow,#428bff22),transparent 80%);
  font-size:35px;border-bottom:1px solid var(--border)
}
.card-level{
  position:absolute;right:8px;top:8px;border-radius:6px;
  background:var(--input);color:var(--muted);font-size:9px;padding:4px 6px
}
.card-body{padding:11px;flex:1}
.card-name{font-size:12px;font-weight:850;min-height:30px;line-height:1.4}
.card-profit{font-size:11px;color:var(--green);margin:7px 0}
.card-footer{
  padding:11px;border-top:1px solid var(--border);
  font-size:12px;font-weight:850;min-height:39px
}
.lock-text{color:var(--muted);font-size:10px;line-height:1.5}
.combo{display:flex;gap:7px;margin:13px 0}
.combo-slot{
  flex:1;min-width:0;background:var(--input);border:1px dashed var(--border);
  border-radius:12px;padding:10px 4px;text-align:center;
  display:flex;flex-direction:column;gap:5px;justify-content:center;
  font-size:10px;min-height:76px
}
.combo-slot b{font-size:24px}
.combo-slot.found{border-color:var(--green);background:#22c55e0c}
.nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:min(100%,540px);z-index:30;
  padding:9px 9px calc(10px + env(safe-area-inset-bottom));
  background:var(--nav);backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:grid;grid-template-columns:repeat(4,1fr);gap:5px
}
.nav button{
  position:relative;background:transparent;color:var(--muted);
  border-radius:14px;padding:9px 3px;font-size:10px
}
.nav button.active{background:#f4c45a0e;color:var(--gold)}
.nav-icon{display:block;font-size:23px;margin-bottom:5px}
.badge{
  position:absolute;top:5px;right:25%;
  width:6px;height:6px;border-radius:50%;background:var(--gold)
}
.overlay{
  position:fixed;inset:0;z-index:80;background:#0009;
  backdrop-filter:blur(8px);display:flex;align-items:flex-end;
  justify-content:center;padding-top:25px;animation:fadeIn .18s
}
.modal{
  width:min(100%,540px);max-height:92dvh;overflow:auto;
  padding:18px 19px calc(24px + env(safe-area-inset-bottom));
  background:var(--surface);border:1px solid var(--border);
  border-radius:26px 26px 0 0;box-shadow:0 -20px 65px #0004;
  animation:slideIn .22s ease-out
}
.modal-handle{
  width:40px;height:4px;border-radius:5px;
  background:var(--muted);opacity:.3;margin:0 auto 18px
}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
.modal-head h2{font-size:21px;margin:0}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:none}}
.toast{
  position:fixed;top:calc(18px + env(safe-area-inset-top));
  left:50%;transform:translateX(-50%);z-index:120;
  width:max-content;max-width:min(90vw,440px);
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:13px 17px;font-size:12px;line-height:1.6;
  text-align:center;box-shadow:var(--shadow);pointer-events:none;
  animation:fadeIn .15s
}
.float-number{
  position:fixed;z-index:60;pointer-events:none;color:#fff;
  font-size:31px;font-weight:900;
  text-shadow:0 2px 4px #0008,0 0 15px #f4c45a60;
  animation:floatUp .8s ease-out forwards;
}
@keyframes floatUp{
  0%{opacity:1;transform:translate(-50%,-50%) scale(.85)}
  20%{transform:translate(-50%,-80%) scale(1.06)}
  100%{opacity:0;transform:translate(-50%,-160px) scale(.94)}
}
.setting{padding:13px 0;border-bottom:1px solid var(--border)}
.segment{display:flex;gap:7px;margin-top:10px}
.segment button{flex:1}
.notice{
  padding:12px;margin:12px 0;border-radius:12px;
  background:#58c9ff0b;border:1px solid #58c9ff22;
  color:var(--muted);font-size:11px;line-height:1.75
}
.calendar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0}
.day{
  background:var(--input);border:1px solid var(--border);
  border-radius:11px;text-align:center;padding:9px 2px;font-size:10px
}
.day.current{border-color:var(--gold)}
.day.done{background:#22c55e0c;border-color:#22c55e40}
.task{
  display:flex;align-items:center;gap:11px;
  padding:13px 0;border-bottom:1px solid var(--border)
}
.task:last-child{border-bottom:0}
.task-icon{font-size:27px;flex:none}
.task-info{flex:1;min-width:0}
.task-title{font-weight:850;font-size:12px;line-height:1.5}
.separator{height:1px;background:var(--border);margin:14px 0}
.cipher-box{
  border:1px solid #bb668655;border-radius:16px;
  padding:14px;margin-top:16px;text-align:center
}
.cipher-code{color:#ed88ac;font-size:26px;font-weight:900;min-height:35px;letter-spacing:5px}
.cipher-word{font-size:19px;font-weight:850;letter-spacing:5px;margin:7px 0}
details{font-size:11px;color:var(--muted);line-height:1.8;margin-top:12px}
summary{color:var(--text);cursor:pointer}
.mono{font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.avatar-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:15px 0}
.avatar-choice{
  aspect-ratio:1;border-radius:14px;background:var(--input);
  border:1px solid var(--border);font-size:28px;overflow:hidden
}
.avatar-choice.selected{border-color:var(--gold);background:#f4c45a16}
.avatar-choice img{width:100%;height:100%;object-fit:cover}
.offline-photo{
  width:230px;height:210px;display:block;object-fit:contain;
  margin:0 auto;filter:drop-shadow(0 12px 13px #0003)
}
.photo-preview{
  width:100%;height:230px;object-fit:contain;border-radius:15px;
  background:
    radial-gradient(circle at 50% 35%,#405982,#162742);
}
.placeholder-panel{
  min-height:150px;display:grid;place-items:center;text-align:center;
  border:1px dashed var(--border);border-radius:16px;
  color:var(--muted);padding:25px;font-size:12px;line-height:1.8
}
.photo-options{display:flex;align-items:center;gap:9px;font-size:12px;margin:12px 0}
.photo-options input{width:19px;height:19px}
.puzzle-board{
  display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);
  aspect-ratio:1;padding:6px;gap:4px;margin:15px 0;
  border:2px solid var(--border);border-radius:16px;
  background:var(--input);position:relative
}
.puzzle-cell{
  background:var(--border);opacity:.3;border-radius:5px;
  grid-row:var(--r);grid-column:var(--c)
}
.vehicle{
  z-index:2;display:grid;place-items:center;font-size:20px;
  border-radius:8px;color:white;border:2px solid #ffffff40;
  background:linear-gradient(145deg,#32b17c,#116342);
  box-shadow:0 4px 8px #0002
}
.vehicle.red{background:linear-gradient(145deg,#de687d,#92364b)}
.vehicle.key{background:linear-gradient(145deg,#ffdf8c,#cb922c);color:#523a10}
.vehicle.selected{outline:3px solid #58c9ff}
.puzzle-exit{position:absolute;right:-14px;top:35%;font-size:22px;color:var(--gold);z-index:4}
.arrows{display:flex;justify-content:center;gap:8px}
.arrows button{min-width:52px;font-size:21px}
.empty{text-align:center;color:var(--muted);padding:30px 15px;font-size:12px}
.stat-list{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat-list .panel{margin:0;padding:12px}
.stat-list strong{display:block;margin-top:5px;font-size:16px}
@media(min-width:700px){
  .app{box-shadow:0 0 90px #0002}
  .overlay{align-items:center;padding:25px}
  .modal{border-radius:25px;max-height:89dvh}
}
@media(max-height:750px){
  .hero-wrap{width:min(100%,285px);margin-top:10px}
  .balance{margin-top:16px}
}
@media(max-width:360px){
  .header{padding-left:12px;padding-right:12px}
  .exchange-button{font-size:9px;gap:3px;padding:8px 5px}
  main{padding-left:12px;padding-right:12px}
  .stat-value{font-size:13px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>
<body>
<div class="app">
  <div class="ambient" aria-hidden="true"></div>
  <header id="header" class="header"></header>
  <main id="main"></main>
  <nav id="nav" class="nav" aria-label="Навигация"></nav>
</div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<!-- Экспорт HTML автоматически помещает сюда фото. -->
<script id="embedded-assets" type="application/json">{"photo":"","avatar":""}</script>

<script>
"use strict";

/* ==========================================================
   HAMSTER EMPIRE — BUSINESS EDITION
   Один HTML. Без библиотек, сервера и внешних изображений.
   Игровые монеты не имеют денежной стоимости.
   ========================================================== */

const STORAGE_KEY = "hamster-empire-browser-v1";

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const now = () => Date.now();
const clamp = (x,a,b) => Math.max(a,Math.min(b,x));
const finite = (v,fallback=0) => {
  const n = Number(v);
  return Number.isFinite(n) ? n : fallback;
};
const safeNumber = (v,max=1e100) => clamp(finite(v),0,max);
const escapeHTML = v => String(v).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

const RANKS = [
  ["Bronze",0],["Silver",5000],["Gold",25000],["Platinum",100000],
  ["Diamond",1000000],["Epic",2000000],["Legendary",10000000],
  ["Master",50000000],["Grandmaster",100000000],["Lord",1000000000],
  ["Creator",10000000000]
];
const RANK_ICONS = ["🥉","🥈","🥇","🔷","💎","⚡","🔥","👑","🌟","🏆","✨"];
const EXCHANGES = ["Binance","Bybit","OKX","BingX","HTX","KuCoin"];

function comboDay(time=now()){
  return Math.floor((time-12*3600000)/86400000);
}
function calendarDay(time=now()){
  return Math.floor((time+3*3600000)/86400000);
}
function comboResetAt(){
  return (comboDay()+1)*86400000+12*3600000;
}
function calendarResetAt(){
  return (calendarDay()+1)*86400000-3*3600000;

function normalizeState(data){
  const d = newState();
  if(!data || typeof data!=="object" || Array.isArray(data))return d;
  const s = {...d};
  s.language = ["ru","en"].includes(data.language)?data.language:"ru";
  s.theme = ["dark","light"].includes(data.theme)?data.theme:"dark";
  s.sound = typeof data.sound==="boolean"?data.sound:true;
  s.nickname = String(data.nickname||d.nickname).slice(0,24);
  s.exchange = EXCHANGES.includes(data.exchange)?data.exchange:"Binance";
  s.avatar = [...AVATARS,"photo","custom"].includes(data.avatar)?data.avatar:"🐹";
  s.tapLevel = Math.floor(safeNumber(data.tapLevel,100));
  s.energyLevel = Math.floor(safeNumber(data.energyLevel,100));
  s.balance = safeNumber(data.balance);
  s.earned = Math.max(s.balance,safeNumber(data.earned));
  s.energy = clamp(finite(data.energy,ENERGY_BASE),0,ENERGY_BASE+s.energyLevel*ENERGY_STEP);
  s.pendingOffline = safeNumber(data.pendingOffline);
  s.lastSeen = clamp(finite(data.lastSeen,now()),0,now());
  s.keys = Math.floor(safeNumber(data.keys,1e9));
  const cards = data.cards && typeof data.cards==="object"?data.cards:{};
  for(const c of CARDS)s.cards[c.id]=Math.floor(safeNumber(cards[c.id],100));
  for(const key of ["comboDay","cipherDay","boostDay","videoDay"]){
    s[key] = Number.isFinite(Number(data[key]))?Math.floor(Number(data[key])):d[key];
  }
  s.comboFound = Array.isArray(data.comboFound)?
    [...new Set(data.comboFound.filter(id=>CARD_BY_ID[id]))].slice(0,3):[];
  s.comboClaimed = !!data.comboClaimed;
  s.cipherClaimed = !!data.cipherClaimed;
  s.boostUsed = Math.floor(safeNumber(data.boostUsed,6));
  s.boostLast = clamp(finite(data.boostLast),0,now());
  s.checkinLast = data.checkinLast===null || data.checkinLast===undefined?
    null:Math.floor(finite(data.checkinLast,calendarDay()-2));
  s.checkinStreak = Math.floor(safeNumber(data.checkinStreak,1e9));
  const tasks = data.tasks && typeof data.tasks==="object"?data.tasks:{};
  for(const task of TASKS)s.tasks[task.id]=tasks[task.id]===true;
  s.videoStart = clamp(finite(data.videoStart),0,now());
  s.puzzleDay = data.puzzleDay===null || data.puzzleDay===undefined?
    null:Math.floor(finite(data.puzzleDay));
  s.wallet = typeof data.wallet==="string"?data.wallet.slice(0,100):"";
  const stats = data.stats && typeof data.stats==="object"?data.stats:{};
  for(const key of Object.keys(s.stats))s.stats[key]=safeNumber(stats[key],1e100);
  if(s.wallet && !validTONAddress(s.wallet))s.wallet="";
  return s;
}

function fmt(n){
  return Math.floor(finite(n)).toLocaleString(
    state.language==="ru"?"ru-RU":"en-US"
  ).replace(/\u00a0/g," ");
}
function compact(n){
  n = Math.max(0,finite(n));
  if(n<1000)return fmt(n);
  const units = [
    [1e15,"Q"],[1e12,"T"],[1e9,"B"],[1e6,"M"],[1e3,"K"]
  ];
  const [divisor,unit]=units.find(([v])=>n>=v);
  return (n/divisor).toFixed(n/divisor<100?1:0).replace(/\.0$/,"")+unit;
}
function timeText(ms){
  const seconds = Math.max(0,Math.ceil(finite(ms)/1000));
  const h=Math.floor(seconds/3600);
  const m=Math.floor(seconds%3600/60);
  const s=seconds%60;
  return h?
    `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:
    `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

  state.balance=Math.min(1e100,state.balance+amount);

  state.balance=Math.max(0,state.balance-amount);
  state.stats.spent=Math.min(1e100,state.stats.spent+amount);

function settle(offline=false){
  const time=now();
  const seconds=Math.max(0,(time-settleClock)/1000);
  settleClock=time;
  state.lastSeen=time;
  if(!seconds)return;
  const income=profitPerHour()*Math.min(seconds,OFFLINE_LIMIT)/3600;
  if(offline)state.pendingOffline=Math.min(1e100,state.pendingOffline+income);
  else credit(income);
  state.energy=clamp(state.energy+seconds*ENERGY_REGEN,0,maxEnergy());
  if(!offline){
    state.stats.playSeconds+=Math.min(seconds,60);
  }
}

  if(state.comboDay!==day){
    state.comboDay=day;
    state.comboFound=[];

    changed=true;
  }
  if(state.cipherDay!==day){
    state.cipherDay=day;
    state.cipherClaimed=false;
    cipherMode=false;
    clearCipher();
    changed=true;
  }
  if(state.videoDay!==day){
    state.videoDay=day;
    state.videoStart=0;
    state.tasks.video=false;
    changed=true;
  }
  if(state.boostDay!==calendarDay()){
    state.boostDay=calendarDay();
    state.boostUsed=0;
    changed=true;
  }
  const combo=dailyCombo();
  state.comboFound=state.comboFound.filter(id=>combo.includes(id));
  return changed;
}

function sound(kind="tap"){
  if(!state.sound || !active)return;
  try{
    const Audio=window.AudioContext||window.webkitAudioContext;
    if(!Audio)return;
    if(!soundContext)soundContext=new Audio();
    if(soundContext.state==="suspended")soundContext.resume().catch(()=>{});
    const start=soundContext.currentTime;
    const frequencies=kind==="reward"?[523,659,784,1047]:
      kind==="buy"?[440,660]:kind==="error"?[160]:[740];
    frequencies.forEach((frequency,i)=>{
      const osc=soundContext.createOscillator();
      const gain=soundContext.createGain();
      osc.connect(gain);
      gain.connect(soundContext.destination);
      const t=start+i*.075;
      osc.type=kind==="tap"?"sine":"triangle";
      osc.frequency.setValueAtTime(frequency,t);
      if(kind==="tap")osc.frequency.exponentialRampToValueAtTime(380,t+.065);
      gain.gain.setValueAtTime(.0001,t);
      gain.gain.exponentialRampToValueAtTime(kind==="tap"?.07:.1,t+.008);
      gain.gain.exponentialRampToValueAtTime(.0001,t+.12);
      osc.start(t);
      osc.stop(t+.14);
    });
  }catch{}
}

function floatNumber(x,y,value){
  if($$(".float-number").length>=30)return;
  const node=document.createElement("div");
  node.className="float-number";
  node.textContent=value;
  node.style.left=x+"px";
  node.style.top=y+"px";
  document.body.appendChild(node);
  node.addEventListener("animationend",()=>node.remove(),{once:true});
  setTimeout(()=>node.remove(),1000);
}

/*
   Автоматическое удаление белого фона.
   1. Фон выделяется заливкой от границ.
   2. Внутренние светлые участки шерсти не вырезаются.
   3. Край обрабатывается мягче и очищается от белого ореола.
*/
async function processImage(file,removeWhite=false,avatar=false){
  if(!file || !file.type.startsWith("image/")){
    throw new Error(T("Выбери файл изображения.","Choose an image file."));
  }
  if(file.size>15*1024*1024){
    throw new Error(T("Максимальный размер файла — 15 МБ.","Maximum file size is 15 MB."));
  }
  const url=URL.createObjectURL(file);
  try{
    const image=await new Promise((resolve,reject)=>{
      const img=new Image();
      img.onload=()=>resolve(img);
      img.onerror=()=>reject(new Error(T(
        "Не удалось открыть изображение.",
        "Could not open the image."
      )));
      img.src=url;
    });
    if(!image.naturalWidth || !image.naturalHeight){
      throw new Error(T("Изображение пустое.","The image is empty."));
    }

    const canvas=document.createElement("canvas");
    let width,height;
    if(avatar){
      width=height=160;
    }else{
      const scale=Math.min(1,720/Math.max(image.naturalWidth,image.naturalHeight));
      width=Math.max(1,Math.round(image.naturalWidth*scale));
      height=Math.max(1,Math.round(image.naturalHeight*scale));
    }
    canvas.width=width;
    canvas.height=height;
    const ctx=canvas.getContext("2d",{willReadFrequently:true});
    if(!ctx)throw new Error(T("Canvas недоступен.","Canvas is unavailable."));

    if(avatar){
      const size=Math.min(image.naturalWidth,image.naturalHeight);
      ctx.drawImage(
        image,(image.naturalWidth-size)/2,(image.naturalHeight-size)/2,
        size,size,0,0,width,height
      );
    }else{
      ctx.drawImage(image,0,0,width,height);
    }

    if(removeWhite && !avatar){
      const pixels=ctx.getImageData(0,0,width,height);
      const data=pixels.data;
      const count=width*height;
      const marked=new Uint8Array(count);
      const queue=new Int32Array(count);
      let head=0,tail=0;

      const isBackground=index=>{
        const o=index*4;
        if(data[o+3]<15)return true;
        const r=data[o],g=data[o+1],b=data[o+2];
        const min=Math.min(r,g,b),max=Math.max(r,g,b);
        return min>=214 && max-min<=29;
      };
      const add=index=>{
        if(index<0 || index>=count || marked[index] || !isBackground(index))return;
        marked[index]=1;
        queue[tail++]=index;
      };

      for(let x=0;x<width;x++){
        add(x);
        add((height-1)*width+x);
      }
      for(let y=0;y<height;y++){
        add(y*width);
        add(y*width+width-1);
      }
      while(head<tail){
        const index=queue[head++];
        const x=index%width;
        if(x>0)add(index-1);
        if(x<width-1)add(index+1);
        if(index>=width)add(index-width);
        if(index<count-width)add(index+width);
      }

      for(let i=0;i<count;i++){
        if(marked[i])data[i*4+3]=0;
      }

      for(let y=1;y<height-1;y++){
        for(let x=1;x<width-1;x++){
          const i=y*width+x;
          if(marked[i])continue;
          let near=false;
          for(let dy=-1;dy<=1 && !near;dy++){
            for(let dx=-1;dx<=1;dx++){
              if(marked[i+dy*width+dx]){
                near=true;
                break;
              }
            }
          }
          if(!near)continue;
          const o=i*4;
          const min=Math.min(data[o],data[o+1],data[o+2]);
          const max=Math.max(data[o],data[o+1],data[o+2]);
          if(min>160 && max-min<80){
            const alpha=clamp((255-min)/85,.08,1);
            data[o+3]=Math.round(data[o+3]*alpha);
            if(alpha<1){
              for(let c=0;c<3;c++){
                data[o+c]=clamp(Math.round(
                  (data[o+c]-255*(1-alpha))/alpha
                ),0,255);
              }
            }
          }
        }
      }
      ctx.putImageData(pixels,0,0);

      let minX=width,minY=height,maxX=-1,maxY=-1;
      for(let y=0;y<height;y++){
        for(let x=0;x<width;x++){
          if(data[(y*width+x)*4+3]>40){
            minX=Math.min(minX,x);
            minY=Math.min(minY,y);
            maxX=Math.max(maxX,x);
            maxY=Math.max(maxY,y);
          }
        }
      }
      if(maxX>=minX && maxY>=minY){
        const padding=12;
        const cropped=document.createElement("canvas");
        cropped.width=maxX-minX+1+padding*2;
        cropped.height=maxY-minY+1+padding*2;
        cropped.getContext("2d").drawImage(
          canvas,minX,minY,maxX-minX+1,maxY-minY+1,
          padding,padding,maxX-minX+1,maxY-minY+1
        );
        return cropped.toDataURL("image/png");
      }
    }
    return canvas.toDataURL("image/png");
  }finally{
    URL.revokeObjectURL(url);
  }
}

/* ---------------- Нажатия и азбука Морзе ---------------- */

function bindHero(){
  const hero=$("#hero");
  if(!hero)return;
  activePointers.clear();
  hero.addEventListener("pointerdown",event=>{
    if(modalName || !active || (event.pointerType==="mouse" && event.button!==0))return;
    event.preventDefault();
    if(activePointers.size>=4 || (cipherMode && activePointers.size))return;
    activePointers.set(event.pointerId,{
      start:performance.now(),x:event.clientX,y:event.clientY
    });
    try{hero.setPointerCapture(event.pointerId)}catch{}
    const rect=hero.getBoundingClientRect();
    const x=(event.clientX-rect.left)/rect.width-.5;
    const y=(event.clientY-rect.top)/rect.height-.5;
    hero.style.transform=`perspective(600px) rotateX(${-y*12}deg) rotateY(${x*12}deg) scale(.967)`;
    clearTimeout(tiltTimer);
    tiltTimer=setTimeout(()=>hero.style.transform="",135);
    if(cipherMode)clearTimeout(cipherTimer);
    else doTap(event.clientX,event.clientY);
  });
  hero.addEventListener("pointerup",event=>{
    const entry=activePointers.get(event.pointerId);
    if(!entry)return;
    activePointers.delete(event.pointerId);
    if(cipherMode)addCipherSymbol(performance.now()-entry.start>300?"-":".",entry);
  });
  hero.addEventListener("pointercancel",event=>{
    activePointers.delete(event.pointerId);
    hero.style.transform="";
  });
  hero.addEventListener("lostpointercapture",event=>{
    activePointers.delete(event.pointerId);
  });
  hero.addEventListener("keydown",event=>{
    if(!["Space","Enter"].includes(event.code) || modalName || !active)return;
    event.preventDefault();
    if(event.repeat)return;
    const rect=hero.getBoundingClientRect();
    const entry={
      start:performance.now(),
      x:rect.left+rect.width/2,y:rect.top+rect.height/2
    };
    if(cipherMode){
      if(activePointers.size)return;
      activePointers.set("keyboard",entry);
      clearTimeout(cipherTimer);
    }else doTap(entry.x,entry.y);
  });
  hero.addEventListener("keyup",event=>{
    if(!["Space","Enter"].includes(event.code))return;
    event.preventDefault();
    const entry=activePointers.get("keyboard");
    if(!entry)return;
    activePointers.delete("keyboard");
    if(cipherMode)addCipherSymbol(performance.now()-entry.start>300?"-":".",entry);
  });
  hero.addEventListener("blur",()=>activePointers.delete("keyboard"));
}
function doTap(x,y){
  settle(false);
  const time=performance.now();
  if(time-lastAcceptedTap<4)return;
  lastAcceptedTap=time;
  const gain=tapValue();
  if(state.energy+1e-8<gain){
    sound("error");
    toast(T("Не хватает энергии. Подожди или используй буст.","Not enough energy. Wait or use a boost."));
    return;
  }
  state.energy=Math.max(0,state.energy-gain);
  credit(gain);
  state.stats.taps++;
  sound();
  haptic();
  floatNumber(x,y,"+"+fmt(gain));
  checkRank();
  updateHUD();
}
function addCipherSymbol(symbol,entry){
  clearTimeout(cipherErrorTimer);
  cipherSymbols+=symbol;
  sound();
  haptic();
  floatNumber(entry.x,entry.y,symbol==="."?"•":"—");
  if(cipherSymbols.length>4){
    cipherSymbols="";
    sound("error");
    toast(T("В букве не больше четырёх сигналов.","A letter has at most four signals."));
    updateCipherUI();
    return;
  }
  updateCipherUI();
  cipherTimer=setTimeout(finishCipherLetter,900);
}
function updateCipherUI(){
  setText("#cipher-code",cipherSymbols.replace(/\./g,"•").replace(/-/g,"—")||" ");
  setText("#cipher-word",cipherLetters||"_");
}
function finishCipherLetter(){
  if(!cipherMode || !active)return;
  rollDays();
  if(!cipherMode)return;
  const letter=MORSE[cipherSymbols];
  cipherSymbols="";
  if(!letter){
    sound("error");
    toast(T("Неизвестный сигнал. Повтори букву.","Unknown signal. Repeat the letter."));
    updateCipherUI();
    return;
  }
  cipherLetters+=letter;
  const word=dailyWord();
  if(!word.startsWith(cipherLetters)){
    sound("error");
    toast(T("Неверная последовательность. Начни заново.","Incorrect sequence. Start again."));
    cipherLetters="";
    updateCipherUI();
    return;
  }
  updateCipherUI();
  if(cipherLetters===word){
    if(!state.cipherClaimed){
      settle(false);
      state.cipherClaimed=true;
      credit(1000000);
      save();
      sound("reward");
      toast(T("Шифр разгадан! +1 000 000","Cipher solved! +1,000,000"));
    }
    cipherMode=false;
    clearCipher();
    render();
  }
}
function toggleCipher(){
  rollDays();
  if(state.cipherClaimed && !cipherMode){
    toast(T("Сегодня шифр уже разгадан.","Today's cipher is already solved."));
    return;
  }
  cipherMode=!cipherMode;
  clearCipher();
  tab="home";
  render();
}

function canPlace(vehicle,x,y){
  if(x<0 || y<0 ||
    x+(vehicle.axis==="h"?vehicle.len:1)>6 ||
    y+(vehicle.axis==="v"?vehicle.len:1)>6)return false;
  for(let i=0;i<vehicle.len;i++){
    const cx=x+(vehicle.axis==="h"?i:0);
    const cy=y+(vehicle.axis==="v"?i:0);
    for(const other of puzzle.vehicles){
      if(other.id===vehicle.id)continue;
      for(let j=0;j<other.len;j++){
        const ox=other.x+(other.axis==="h"?j:0);
        const oy=other.y+(other.axis==="v"?j:0);
        if(cx===ox && cy===oy)return false;
      }
    }
  }
  return true;
}
function movePuzzle(direction){
  if(!puzzle || puzzle.finished)return;
  if(now()>=puzzle.deadline){endPuzzle(false);return}
  const v=puzzle.vehicles.find(x=>x.id===puzzle.selected);
  if(!v)return;
  const moves={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]};
  if(!moves[direction])return;
  const [dx,dy]=moves[direction];
  if((v.axis==="h" && dy) || (v.axis==="v" && dx))return;
  if(!canPlace(v,v.x+dx,v.y+dy)){sound("error");return}
  v.x+=dx;
  v.y+=dy;
  puzzle.moves++;
  sound();
  if(v.id==="key" && v.x+v.len===6){endPuzzle(true);return}
  renderModal();
}
function endPuzzle(won){
  if(!puzzle || puzzle.finished)return;
  puzzle.finished=true;
  puzzle.won=won;
  if(won && state.puzzleDay!==comboDay()){
    state.keys++;
    state.puzzleDay=comboDay();
    save();
    sound("reward");
    haptic();
  }else if(!won)sound("error");
  if(modalName==="puzzle")renderModal();
}

/* ---------------- Проверка TON-адресов ---------------- */

function crc16(bytes){
  let crc=0;
  for(const byte of bytes){
    crc^=byte<<8;
    for(let i=0;i<8;i++){
      crc=((crc&0x8000)?(crc<<1)^0x1021:crc<<1)&0xffff;
    }
  }
  return crc;
}
function validTONAddress(address){
  if(/^(0|-1):[0-9a-fA-F]{64}$/.test(address))return true;
  if(!/^[A-Za-z0-9_-]{48}$/.test(address))return false;
  try{
    const binary=atob(address.replace(/-/g,"+").replace(/_/g,"/"));
    const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
    if(bytes.length!==36)return false;
    const tag=bytes[0]&0x7f;
    if(tag!==0x11 && tag!==0x51)return false;
    if(bytes[1]!==0 && bytes[1]!==255)return false;
    const check=crc16(bytes.slice(0,34));
    return bytes[34]===(check>>8) && bytes[35]===(check&255);
  }catch{return false}
}

/* ---------------- Покупки и награды ---------------- */

function buyCard(id){
  settle(false);
  rollDays();
  const c=CARD_BY_ID[id];
  if(!c)return;
  const reason=lockReason(c);
  if(reason){toast(reason);return}
  if((state.cards[id]||0)>=100)return;
  if(!spend(cardPrice(c))){
    toast(T("Недостаточно монет.","Not enough coins."));
    sound("error");
    return;
  }
  state.cards[id]=(state.cards[id]||0)+1;
  profitCache=null;
  const found=dailyCombo().includes(id) && !state.comboFound.includes(id);
  if(found)state.comboFound.push(id);
  save();
  sound("buy");
  render();
  if(modalName)renderModal();
  toast(found?T("Найдено направление комбо!","Combo business found!"):
    T("Бизнес улучшен.","Business upgraded."));
}
function claimCombo(){
  settle(false);
  rollDays();
  if(state.comboClaimed || state.comboFound.length!==3)return;
  state.comboClaimed=true;
  credit(5000000);
  save();
  sound("reward");
  render();
  if(modalName)renderModal();
  toast(T("Комбо собрано! +5 000 000","Combo complete! +5,000,000"));
}
function buyBoost(type){
  if(!["tap","energy"].includes(type))return;
  settle(false);
  const level=type==="tap"?state.tapLevel:state.energyLevel;
  if(level>=100)return;
  if(!spend(boostPrice(type))){
    sound("error");
    toast(T("Недостаточно монет.","Not enough coins."));
    return;
  }
  if(type==="tap")state.tapLevel++;
  else{
    state.energyLevel++;
    state.energy=Math.min(maxEnergy(),state.energy+ENERGY_STEP);
  }
  save();
  sound("buy");
  render();
  renderModal();
}
function useFullEnergy(){
  settle(false);
  rollDays();
  if(state.boostUsed>=6 || now()-state.boostLast<3600000)return;
  if(state.energy>=maxEnergy()-.1){
    toast(T("Энергия уже полная.","Energy is already full."));
    return;
  }
  state.energy=maxEnergy();
  state.boostUsed++;
  state.boostLast=now();
  save();
  sound("reward");
  render();
  renderModal();
}
function claimCheckin(){
  settle(false);
  const info=checkinInfo();
  if(info.claimed)return;
  const reward=CHECKIN[info.next-1];
  state.checkinStreak=info.streak+1;
  state.checkinLast=info.today;
  credit(reward);
  save();
  sound("reward");
  render();
  toast(T("Ежедневная награда: +","Daily reward: +")+fmt(reward));
}
function claimTask(id){
  const task=TASKS.find(t=>t.id===id);
  if(!task || task.id==="video" || state.tasks[id])return;
  settle(false);
  state.tasks[id]=true;
  credit(task.reward);
  save();
  sound("reward");
  closeModal();
  render();
  toast(T("Награда получена: +","Reward claimed: +")+fmt(task.reward));
}
function claimVideo(){
  rollDays();
  if(state.tasks.video)return;
  if(!state.videoStart || now()-state.videoStart<3600000){

/* ---------------- Экспорт и импорт ---------------- */

function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const anchor=document.createElement("a");
  anchor.href=url;
  anchor.download=name;
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function exportSave(){
  save();
  const data={...state,assets};
  downloadBlob(
    new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),
    "hamster-empire-business-save.json"
  );
}
function exportHTML(){
  const copy=document.documentElement.cloneNode(true);
  copy.querySelector("#header").innerHTML="";
  copy.querySelector("#main").innerHTML="";
  copy.querySelector("#nav").innerHTML="";
  copy.querySelector("#modal-root").innerHTML="";
  copy.querySelector("#toast-root").innerHTML="";
  copy.querySelector("body").style.overflow="";
  copy.querySelectorAll(".float-number").forEach(node=>node.remove());
  copy.querySelector("#embedded-assets").textContent=JSON.stringify(assets);
  downloadBlob(
    new Blob(["<!DOCTYPE html>\n"+copy.outerHTML],{type:"text/html;charset=utf-8"}),
    "hamster-empire-with-photo.html"
  );
  toast(T("HTML с изображениями скачан.","HTML with embedded images downloaded."));
}
async function importSave(){
  const file=$("#import-file")?.files?.[0];
  if(!file){
    toast(T("Выбери JSON-файл.","Choose a JSON file."));
    return;
  }
  if(file.size>12*1024*1024){
    toast(T("Файл слишком большой: максимум 12 МБ.","File too large: maximum 12 MB."));
    return;
  }
  try{
    const data=JSON.parse(await file.text());
    if(!data || ![1,2].includes(data.version) ||
      typeof data.balance!=="number" || !Number.isFinite(data.balance) ||
      !data.cards || typeof data.cards!=="object"){
      throw new Error("Invalid save");
    }
    const imported=normalizeState(data);
    imported.lastSeen=now();
    if(data.assets)assets=normalizeAssets(data.assets);
    state=imported;
    profitCache=null;
    settleClock=now();
    displayedBalance=state.balance;
    lastRenderedRank=rankIndex();
    cipherMode=false;
    clearCipher();
    puzzle=null;
    tab="home";
    rollDays();
    saveAssets();
    writeSave();
    closeModal();
    render();
    toast(T("Сохранение импортировано.","Save imported."));
  }catch{
    toast(T("Не удалось прочитать корректное сохранение.","Could not read a valid save."));
  }
}

/* ---------------- Обработчики интерфейса ---------------- */

document.addEventListener("click",event=>{
  if(event.target.id==="overlay"){closeModal();return}
  const button=event.target.closest("[data-action]");
  if(!button || button.disabled)return;
  const action=button.dataset.action;
  const id=button.dataset.id;

  switch(action){
    case "tab":
      if(!["home","mine","earn","airdrop"].includes(id))break;
      if(id!=="home"){
        cipherMode=false;
        clearCipher();
      }
      tab=id;
      render();
      window.scrollTo({top:0,behavior:"auto"});
      break;

    case "category":
      if(id!=="all" && !CATEGORIES.some(c=>c.id===id))break;
      mineCategory=id;
      renderMine();
      updateHUD();
      break;

    case "settings":openModal("settings");break;
    case "photo":openModal("photo");break;
    case "photo-upload":uploadPhoto();break;

    case "photo-remove":
      assets.photo="";
      if(state.avatar==="photo")state.avatar="🐹";
      saveAssets();
      save();
      render();
      renderModal();
      break;

    case "avatar":openModal("avatar");break;
    case "avatar-upload":uploadAvatar();break;

    case "avatar-select":
      if(![...AVATARS,"photo","custom"].includes(id))break;
      if(id==="photo" && !assets.photo)break;
      if(id==="custom" && !assets.avatar)break;
      state.avatar=id;
      save();
      renderHeader();
      updateHUD();
      renderModal();
      break;

    case "exchange":openModal("exchange");break;

    case "exchange-select":
      if(!EXCHANGES.includes(id))break;
      state.exchange=id;
      save();
      closeModal();
      render();
      break;

    case "language":
      if(!["ru","en"].includes(id))break;
      state.language=id;
      save();
      render();
      renderModal();
      break;

    case "theme":
      if(!["dark","light"].includes(id))break;
      state.theme=id;
      save();
      render();
      renderModal();
      break;

    case "sound":
      state.sound=!state.sound;
      save();
      if(state.sound)sound("buy");
      renderModal();
      break;

    case "nickname-save":{
      const name=($("#nickname-input")?.value||"").trim().slice(0,24);
      if(!name){
        toast(T("Имя не может быть пустым.","Name cannot be empty."));
        break;
      }
      state.nickname=name;
      save();
      renderHeader();
      updateHUD();
      toast(T("Имя сохранено.","Name saved."));
      break;
    }

    case "close":closeModal();break;
    case "boosts":openModal("boosts");break;
    case "boost-buy":buyBoost(id);break;
    case "full-energy":useFullEnergy();break;
    case "card":if(CARD_BY_ID[id])openModal("card",id);break;
    case "card-buy":buyCard(id);break;
    case "combo":openModal("combo");break;
    case "combo-claim":claimCombo();break;
    case "cipher-toggle":toggleCipher();break;
    case "cipher-help":openModal("cipher-help");break;

    case "cipher-clear":
      clearCipher();
      updateCipherUI();
      break;

    case "stat-tap":{
      const time=now();
      statTapTimes=statTapTimes.filter(t=>time-t<1200);
      statTapTimes.push(time);
      if(statTapTimes.length>=3){
        statTapTimes=[];
        toggleCipher();
      }
      break;
    }

    case "puzzle":startPuzzle();break;
    case "puzzle-retry":startPuzzle();break;

    case "puzzle-select":
      if(puzzle && !puzzle.finished && puzzle.vehicles.some(v=>v.id===id)){
        puzzle.selected=id;
        renderModal();
      }
      break;

    case "puzzle-move":movePuzzle(id);break;
    case "checkin":claimCheckin();break;
    case "task":openModal("task",id);break;
    case "task-claim":claimTask(id);break;

    case "video-start":
      rollDays();
      if(!state.videoStart){
        state.videoStart=now();
        save();
        renderModal();
      }
      break;

    case "video-claim":claimVideo();break;
    case "wallet":openModal("wallet");break;

    case "wallet-save":{
      const address=($("#wallet-input")?.value||"").trim();
      if(!validTONAddress(address)){
        sound("error");
        toast(T("Некорректный TON-адрес или контрольная сумма.","Invalid TON address or checksum."));
        break;
      }
      state.wallet=address;
      save();
      closeModal();
      render();
      sound("buy");
      toast(T("Публичный адрес сохранён.","Public address saved."));
      break;
    }

    case "wallet-remove":
      state.wallet="";
      save();
      render();
      break;

    case "offline-claim":{
      settle(false);
      const amount=state.pendingOffline;
      state.pendingOffline=0;
      credit(amount);
      save();
      closeModal();
      sound("reward");
      render();
      toast(T("Офлайн-доход: +","Offline earnings: +")+fmt(amount));
      break;
    }

    case "reset-confirm":openModal("reset");break;

    case "reset":{
      const preferences={
        language:state.language,theme:state.theme,
        sound:state.sound,avatar:state.avatar,nickname:state.nickname
      };
      state={...newState(),...preferences};
      profitCache=null;
      settleClock=now();
      displayedBalance=0;
      lastRenderedRank=0;
      cipherMode=false;
      clearCipher();
      puzzle=null;
      tab="home";
      writeSave();
      closeModal();
      render();
      break;
    }

    case "export":exportSave();break;
    case "export-html":exportHTML();break;
    case "import":openModal("import");break;
    case "import-apply":importSave();break;
  }
});
document.addEventListener("input",event=>{
  if(event.target.id==="mine-search"){
    mineSearch=event.target.value;
    renderBusinessList();
  }
});
document.addEventListener("change",event=>{
  if(event.target.id==="mine-sort"){
    mineSort=event.target.value;
    renderBusinessList();
  }
});
document.addEventListener("keydown",event=>{
  if(event.key==="Escape"){
    if(modalName)closeModal();
    else if(cipherMode){cipherMode=false;clearCipher();render()}
    return;
  }
  if(modalName==="puzzle" && puzzle && !puzzle.finished){
    const directions={
      ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down"
    };
    if(directions[event.key]){
      event.preventDefault();
      movePuzzle(directions[event.key]);
      return;
    }
  }
  if(event.key==="Tab" && modalName){
    const nodes=$$(
      ".modal button:not(:disabled), .modal input:not(:disabled), "+
      ".modal select, .modal a[href], .modal summary"
    );
    if(!nodes.length)return;
    const first=nodes[0],last=nodes[nodes.length-1];
    const inside=document.activeElement?.closest(".modal");
    if(event.shiftKey && (document.activeElement===first || !inside)){
      event.preventDefault();
      last.focus();
    }else if(!event.shiftKey && (document.activeElement===last || !inside)){
      event.preventDefault();
      first.focus();
    }
  }
});
document.addEventListener("contextmenu",event=>{
  if(event.target.closest("#hero"))event.preventDefault();
});

/* ---------------- Циклы и жизненный цикл страницы ---------------- */

function tick(){
  if(!active)return;
  settle(false);
  const changed=rollDays();
  if(changed){
    render();
    if(modalName)renderModal();
    writeSave();
  }
  checkRank();
  if(puzzle && !puzzle.finished && now()>=puzzle.deadline)endPuzzle(false);
  if(modalName==="boosts"){
    const button=$('[data-action="full-energy"]');
    if(button){
      const ready=state.boostUsed<6 && now()-state.boostLast>=3600000;
      button.disabled=!ready;
    }
  }
  updateHUD();
}
function frame(timestamp){
  const dt=clamp((timestamp-lastFrame)/1000,0,.1);
  lastFrame=timestamp;
  if(active){
    const smoothing=1-Math.exp(-dt*13);
    displayedBalance+=(state.balance-displayedBalance)*smoothing;
    if(Math.abs(state.balance-displayedBalance)<.5){
      displayedBalance=state.balance;
    }
    if(timestamp-lastHUD>45){
      setText("#balance-number",fmt(displayedBalance));
      lastHUD=timestamp;
    }
  }
  requestAnimationFrame(frame);
}
function suspend(){
  if(!active)return;
  settle(false);
  active=false;
  writeSave();
  if(puzzle && !puzzle.finished)endPuzzle(false);
  activePointers.clear();
  clearTimeout(cipherTimer);
  cipherSymbols="";
  updateCipherUI();
}
function resume(){
  if(active || document.hidden)return;
  settle(true);
  active=true;
  lastFrame=performance.now();
  rollDays();
  writeSave();
  render();
  if(state.pendingOffline>=1)openModal("offline");
  else if(modalName)renderModal();
}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden)suspend();
  else resume();
});
window.addEventListener("pagehide",()=>{
  suspend();
  writeSave();
});
window.addEventListener("pageshow",event=>{
  if(event.persisted)resume();
});
window.addEventListener("blur",()=>{
  activePointers.clear();
  if($("#hero"))$("#hero").style.transform="";
});

settle(true);
rollDays();
lastRenderedRank=rankIndex();

if(state.avatar==="photo" && !assets.photo)state.avatar="🐹";
if(state.avatar==="custom" && !assets.avatar)state.avatar="🐹";

writeSave();
render();

setInterval(tick,200);
setInterval(()=>{if(active)save()},5000);
requestAnimationFrame(frame);

if(state.pendingOffline>=1){
  setTimeout(()=>{if(!modalName)openModal("offline")},350);
}else if(migrationNotice){
  setTimeout(()=>toast(T(
    "Сохранение перенесено: 60 бизнесов, энергия 1000 +250/ур., офлайн до 1 часа.",
    "Save migrated: 60 businesses, energy 1000 +250/level, offline up to 1 hour."
  )),450);
}
</script>
